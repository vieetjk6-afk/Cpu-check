name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Phát hành bản mới (vd 1.1.0 – tự tạo tag v1.1.0 và GitHub Release). Để trống = chỉ build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Tag "v1.2.3" -> phiên bản 1.2.3 được ghi vào ứng dụng (trình cập nhật so sánh với bản phát hành mới nhất).
      # Chạy tay (workflow_dispatch) với release_version = "1.2.3" -> tạo tag v1.2.3 + Release, chỉ trên nhánh mặc định.
      - name: Version
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          $v = ""
          $tag = ""
          if ($env:REF -like "refs/tags/v*") {
            $tag = $env:REF_NAME
            $v = ($tag.Substring(1) -replace '[-+].*$', '')
          }
          elseif ($env:RELEASE_INPUT) {
            $ver = $env:RELEASE_INPUT.Trim().TrimStart('v')
            if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "release_version không hợp lệ: '$ver' (dạng 1.2.3 hoặc 1.2.3-beta)" }
            if ($env:REF_NAME -ne $env:DEFAULT_BRANCH) { throw "Chỉ phát hành từ nhánh mặc định ($env:DEFAULT_BRANCH), đang ở $env:REF_NAME" }
            if (git ls-remote --tags origin "refs/tags/v$ver") { throw "Tag v$ver đã tồn tại" }
            $tag = "v$ver"
            $v = ($ver -replace '[-+].*$', '')
          }
          if ($v) { "args=-p:Version=$v" >> $env:GITHUB_OUTPUT } else { "args=" >> $env:GITHUB_OUTPUT }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($tag.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $(if ($v) { $v } else { 'default (Directory.Build.props)' }) Tag: $tag"

      - name: Restore
        run: dotnet restore PcCheck.sln

      - name: Build
        run: dotnet build PcCheck.sln -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test PcCheck.sln -c Release --no-build --verbosity normal

      - name: Publish portable (self-contained, 1 file .exe)
        run: >
          dotnet publish src/PcCheck.App/PcCheck.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:PcCheckFlavor=portable
          ${{ steps.version.outputs.args }}
          -o publish/portable

      # Xóa kết quả trung gian của bản self-contained, tránh bản nhỏ bị đóng gói nhầm cả runtime.
      - name: Clean intermediate output
        shell: pwsh
        run: Remove-Item -Recurse -Force src/PcCheck.App/obj/Release, src/PcCheck.App/bin/Release -ErrorAction SilentlyContinue

      - name: Publish small (needs .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/PcCheck.App/PcCheck.App.csproj -c Release -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PcCheckFlavor=small
          ${{ steps.version.outputs.args }}
          -o publish/small

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/portable/* -DestinationPath publish/PcCheck-portable-win-x64.zip
          Compress-Archive -Path publish/small/* -DestinationPath publish/PcCheck-small-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PcCheck-portable-win-x64
          path: publish/portable/

      - uses: actions/upload-artifact@v4
        with:
          name: PcCheck-small-win-x64
          path: publish/small/

      - name: GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Chạy tay: tag được tạo mới trên đúng commit vừa build.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Tag kiểu v1.3.0-beta -> pre-release: trình cập nhật trong ứng dụng bỏ qua.
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            publish/PcCheck-portable-win-x64.zip
            publish/PcCheck-small-win-x64.zip
