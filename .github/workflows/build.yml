name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Tag "v1.2.3" -> phiên bản 1.2.3 được ghi vào ứng dụng (trình cập nhật so sánh với bản phát hành mới nhất).
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = ("${{ github.ref_name }}".Substring(1) -replace '[-+].*$', '') }
          if ($v) { "args=-p:Version=$v" >> $env:GITHUB_OUTPUT } else { "args=" >> $env:GITHUB_OUTPUT }
          Write-Host "Version: $(if ($v) { $v } else { 'default (Directory.Build.props)' })"

      - name: Restore
        run: dotnet restore PcCheck.sln

      - name: Build
        run: dotnet build PcCheck.sln -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test PcCheck.sln -c Release --no-build --verbosity normal

      - name: Publish portable (self-contained, 1 file .exe)
        run: >
          dotnet publish src/PcCheck.App/PcCheck.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:PcCheckFlavor=portable
          ${{ steps.version.outputs.args }}
          -o publish/portable

      # Xóa kết quả trung gian của bản self-contained, tránh bản nhỏ bị đóng gói nhầm cả runtime.
      - name: Clean intermediate output
        shell: pwsh
        run: Remove-Item -Recurse -Force src/PcCheck.App/obj/Release, src/PcCheck.App/bin/Release -ErrorAction SilentlyContinue

      - name: Publish small (needs .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/PcCheck.App/PcCheck.App.csproj -c Release -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PcCheckFlavor=small
          ${{ steps.version.outputs.args }}
          -o publish/small

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/portable/* -DestinationPath publish/PcCheck-portable-win-x64.zip
          Compress-Archive -Path publish/small/* -DestinationPath publish/PcCheck-small-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PcCheck-portable-win-x64
          path: publish/portable/

      - uses: actions/upload-artifact@v4
        with:
          name: PcCheck-small-win-x64
          path: publish/small/

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Tag kiểu v1.3.0-beta -> pre-release: trình cập nhật trong ứng dụng bỏ qua.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            publish/PcCheck-portable-win-x64.zip
            publish/PcCheck-small-win-x64.zip
